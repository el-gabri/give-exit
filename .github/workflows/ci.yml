name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # frontend extra is required: the test suite imports Streamlit at
        # collection time (tests/test_frontend_entrypoint.py).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,frontend]"
      - name: Lint
        run: ruff check app tests frontend
      - name: Dependency vulnerability audit
        run: |
          # SECURITY.md records why these no-fix Chroma server/RBAC advisories
          # are outside the embedded-only adapter's accepted deployment scope.
          # The exception is time-bounded and must be removed when upstream
          # ships a patched release.
          pip-audit . --strict --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln CVE-2026-45831
          # Also audit installed dev/frontend extras. pip-audit cannot combine
          # --strict with intentionally skipped editable local distributions.
          pip-audit --skip-editable --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln CVE-2026-45831
      - name: Type check (strict)
        run: mypy app
      - name: Tests (offline - mock LLM provider)
        run: pytest -q
      - name: Coverage (scoped to modules with dedicated tests)
        # [tool.coverage.run] source in pyproject.toml lists the modules held
        # to 100%; it grows module by module as follow-up work adds tests
        # elsewhere, instead of gating the whole repo at once.
        run: pytest --cov --cov-report=term-missing
      - name: Import architecture (no upward dependencies from app.core)
        run: lint-imports
      - name: Dead code
        run: vulture app --min-confidence 90
      - name: Consumer legal-retrieval regression gates
        # This is an engineering-authored seed, not a lawyer-certified legal
        # golden set.  The gates still prevent the measured offline baseline
        # from silently regressing and enforce fail-safe abstention behavior.
        #
        # Re-baselined on 2026-09-14 for the two-query builder with a single
        # legal lexicon (no intake category). The dataset also gained the
        # unrequested-service case, so the case count moves from 21 to 22.
        #
        # The offline stack's dense side is a hashed 128-dimension embedder,
        # so that stack is effectively BM25. It was measured to be blind to
        # the case this change targets, scoring 0/3 relevant and 0 hard
        # negatives on it, and both consumer_recall@5 and
        # consumer_ndcg@5 measured 0.0 across the whole seed on this stack.
        # On the configured JUÁ stack the same case improved: Civil Code
        # arts. 878, 880 and 881 (the undue-payment chapter, premised on a
        # payment that never happened) stopped being cited and CDC art. 52
        # started being cited (exact recall 0/3 -> 1/3; ADR 0016).
        # consumer_retrieval_success@5 and consumer_abstention@5 stay pinned
        # at 1.0 and consumer_inactive_provision_rate@5 /
        # consumer_unknown_status_rate@5 stay pinned at 0.0 regardless of
        # measurement -- those are the hard invariants.
        run: |
          python -m app.evaluation.consumer_runner \
            eval_data/consumer_legal_retrieval \
            --output consumer-legal-retrieval-results.json \
            --min consumer_retrieval_success@5=1.0 \
            --min consumer_recall@5=0.00 \
            --min consumer_article_recall@5=0.10 \
            --min consumer_ndcg@5=0.00 \
            --min consumer_abstention@5=1.0 \
            --max consumer_hard_negative_rate@5=0.05 \
            --max consumer_inactive_provision_rate@5=0.0 \
            --max consumer_unknown_status_rate@5=0.0
      - name: Consumer notice final-ground gates
        # Scores the grounds the production selector would cite, not ranked
        # candidates.
        #
        # Re-baselined on 2026-09-14 for the two-query builder: the known-bad
        # ceiling moved from 1 to 3, deliberately, on user sign-off. The
        # offline stack's dense side is a hashed 128-dimension embedder (so
        # this stack is effectively BM25); it was measured to be blind to the
        # case this change targets, and the three known-bad citations
        # measured here come from three pre-existing cases, not from the new
        # one. On the configured JUÁ stack the targeted case improved instead
        # (Civil Code arts. 878/880/881 stopped being cited, CDC art. 52
        # started being cited; ADR 0016). consumer_notice_abstention stays
        # pinned at 1.0 regardless of measurement.
        run: |
          python -m app.evaluation.consumer_runner \
            eval_data/consumer_legal_retrieval \
            --evaluate-notice \
            --output consumer-notice-results.json \
            --max consumer_notice_known_bad_citations=3 \
            --min consumer_notice_abstention=1.0
      - name: Upload consumer evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-legal-retrieval-results
          path: |
            consumer-legal-retrieval-results.json
            consumer-notice-results.json
      - name: Security gate benchmark
        # Thresholds are asserted in tests/test_security_benchmark.py; this
        # step publishes the per-category numbers in the build log.
        run: python -m app.evaluation.security_benchmark

  python-310-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,frontend]"
      - name: Python 3.10 tests
        run: pytest -q

  container-build:
    runs-on: ubuntu-latest
    needs: [test, python-310-compatibility]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target api --tag give-exit-api:ci .
      - name: Build frontend image
        run: docker build --target frontend --tag give-exit-frontend:ci .
