name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # frontend extra is required: the test suite imports Streamlit at
        # collection time (tests/test_frontend_entrypoint.py).
        run: pip install -e ".[dev,frontend]"
      - name: Lint
        run: ruff check app tests frontend
      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner off
      - name: Type check (strict)
        run: mypy app
      - name: Tests (offline - mock LLM provider)
        run: pytest -q
      - name: Evaluation harness with regression gates
        env:
          LITIGATION_LLM_PROVIDER: mock
          LITIGATION_VECTOR_STORE: memory
        # Offline, retrieval ranking and pipeline health are the meaningful
        # signals. Groundedness and extraction accuracy are structurally zero
        # under the mock provider, so gating them here would be theatre.
        run: |
          python -m app.evaluation eval_data \
            --require-no-errors \
            --min retrieval_hit_rate@3=1.0 \
            --min retrieval_recall@3=1.0 \
            --min retrieval_ndcg@3=0.90 \
            --min retrieval_mrr@3=0.90
      - name: Security gate benchmark
        # Thresholds are asserted in tests/test_security_benchmark.py; this
        # step publishes the per-category numbers in the build log.
        run: python -m app.evaluation.security_benchmark
