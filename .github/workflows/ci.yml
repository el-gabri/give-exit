name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # frontend extra is required: the test suite imports Streamlit at
        # collection time (tests/test_frontend_entrypoint.py).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,frontend]"
      - name: Lint
        run: ruff check app tests frontend
      - name: Dependency vulnerability audit
        run: |
          # SECURITY.md records why these no-fix Chroma server/RBAC advisories
          # are outside the embedded-only adapter's accepted deployment scope.
          # The exception is time-bounded and must be removed when upstream
          # ships a patched release.
          pip-audit . --strict --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln CVE-2026-45831
          # Also audit installed dev/frontend extras. pip-audit cannot combine
          # --strict with intentionally skipped editable local distributions.
          pip-audit --skip-editable --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln CVE-2026-45831
      - name: Type check (strict)
        run: mypy app
      - name: Tests (offline - mock LLM provider)
        run: pytest -q
      - name: Coverage (scoped to modules with dedicated tests)
        # [tool.coverage.run] source in pyproject.toml lists the modules held
        # to 100%; it grows module by module as follow-up work adds tests
        # elsewhere, instead of gating the whole repo at once.
        run: pytest --cov --cov-report=term-missing
      - name: Import architecture (no upward dependencies from app.core)
        run: lint-imports
      - name: Dead code
        run: vulture app --min-confidence 90
      - name: Consumer legal-retrieval regression gates
        # This is an engineering-authored seed, not a lawyer-certified legal
        # golden set.  The gates still prevent the measured offline baseline
        # from silently regressing and enforce fail-safe abstention behavior.
        #
        # Re-baselined on 2026-09-14 for the narrative-only query builder
        # (consumer-legal-narrative-v6): the fixed legal lexicon appended to
        # every query was measured to dilute the case-specific signal and was
        # removed (app/consumer/retrieval.py). On this offline (hashed-
        # embedder, effectively BM25) stack over the 22-case seed, removing
        # the lexicon raised every retrieval metric: consumer_recall@5 0.000
        # -> 0.142, consumer_article_recall@5 0.100 -> 0.225,
        # consumer_ndcg@5 0.000 -> 0.069, consumer_hard_negative_rate@5 ->
        # 0.027. On the configured JUÁ stack the one case this change
        # targets improved similarly: Civil Code arts. 878, 880 and 881 (the
        # undue-payment chapter, premised on a payment that never happened)
        # stopped being cited and CDC art. 52 started being cited (3 grounds
        # instead of 5, same relevant hit).
        #
        # Re-baselined on 2026-09-24 for dataset 2.1.0 (15 new cases; the
        # system did not change and the original 22 cases score exactly as
        # before). The new cases are lay paraphrases the offline stack barely
        # ranks, so the averages fell: recall@5 0.142 -> 0.086, article
        # recall@5 0.225 -> 0.212, nDCG@5 0.075 -> 0.045, hard-negative
        # rate@5 0.027 -> 0.032. The gates sit just below the new measurement.
        # consumer_retrieval_success@5 stays pinned at 1.0 and
        # consumer_inactive_provision_rate@5 / consumer_unknown_status_rate@5
        # stay pinned at 0.0 regardless of measurement -- those are the hard
        # invariants. consumer_abstention@5 was pinned at 1.0 too, until dataset
        # 2.4.0 (see the 2026-10-04 note below).
        #
        # Re-baselined on 2026-10-02 for the development split of dataset 2.2.0
        # (the 22 original cases plus the traffic-fine and private-loan cases).
        # The 19 holdout cases are reported by their own step and never gated, so
        # no parameter is tuned against them. Development: recall@5 0.142,
        # article recall@5 0.225, nDCG@5 0.075, hard-negative rate@5 0.025.
        #
        # Re-baselined on 2026-10-03 for corpus v5 (lay-language alias chunks,
        # prompt v2, ADR 0022), development split: recall@5 0.142 -> 0.242,
        # article recall@5 0.225 -> 0.550, nDCG@5 0.075 -> 0.181, hard-negative
        # rate@5 0.025 (unchanged).
        #
        # Re-baselined on 2026-10-04 for dataset 2.4.0 and the relationship-class
        # scope gate (ADR 0024). The 24 earlier development cases score exactly
        # as before; the 8 new in-scope look-alikes, which this stack barely
        # ranks, pull the averages down: recall@5 0.242 -> 0.208, article
        # recall@5 0.550 -> 0.446, nDCG@5 0.181 -> 0.159, hard-negative rate@5
        # 0.025 -> 0.015. consumer_abstention@5 is no longer pinned at 1.0: 4 of
        # the 20 new out-of-scope development cases name no non-consumer
        # relationship the lexical gate knows (by design; the optional LLM scope
        # check is their backstop, off in CI), so 20 of 24 abstain (0.833).
        run: |
          python -m app.evaluation.consumer_runner \
            eval_data/consumer_legal_retrieval \
            --split development \
            --output consumer-legal-retrieval-results.json \
            --min consumer_retrieval_success@5=1.0 \
            --min consumer_recall@5=0.20 \
            --min consumer_article_recall@5=0.44 \
            --min consumer_ndcg@5=0.15 \
            --min consumer_abstention@5=0.83 \
            --max consumer_hard_negative_rate@5=0.03 \
            --max consumer_inactive_provision_rate@5=0.0 \
            --max consumer_unknown_status_rate@5=0.0
      - name: Consumer notice final-ground gates
        # Scores the grounds the production selector would cite, not ranked
        # candidates.
        #
        # Re-baselined on 2026-09-14 for the narrative-only query builder
        # (consumer-legal-narrative-v6): removing the fixed legal lexicon
        # also removes the extra query that fed extra, sometimes wrong,
        # chunks into every notice. On this offline (hashed-embedder,
        # effectively BM25) stack the known-bad ceiling fell from 3 to 0 and
        # total grounds fell from 70 to 23. On the configured JUÁ stack the
        # one case this change targets improved similarly (Civil Code arts.
        # 878/880/881 stopped being cited, CDC art. 52 started being cited).
        # consumer_notice_abstention was pinned at 1.0 until dataset 2.4.0
        # (see the 2026-10-04 note below).
        #
        # Re-measured on 2026-09-24 for ADR 0019 (explicit channel-agreement
        # gate within rank 20, citable-only legal index): 20 grounds instead
        # of 23, 3 complementary instead of 5, known-bad still 0, same exact
        # hit. The retrieval gates above are unchanged (nDCG@5 0.069 ->
        # 0.075, every other metric equal).
        #
        # Re-measured on 2026-09-24 for ADR 0020 (LGPD grounds need no CDC
        # anchor): 24 grounds, 7 complementary; the two data-protection cases
        # that cited nothing now cite the LGPD. Known-bad still 0.
        #
        # Re-measured on 2026-09-24 for agreement depth 13 (ADR 0019, chosen
        # on the configured JUÁ stack): 17 grounds, 5 complementary, known-bad
        # 0. The offline stack's single exact hit needs depth 20, so offline
        # exact recall is 0; no gate reads it.
        #
        # Re-measured on 2026-10-02 for the development split of dataset 2.2.0:
        # 17 grounds, 1 labelled, 16 unlabelled, known-bad 0, abstention 1.0.
        # consumer_notice_labelled_grounds >= 1 fails a selector that cites
        # nothing, which the known-bad and abstention gates alone would pass.
        #
        # Re-measured on 2026-10-03 for agreement depth 10 and the alias support
        # cap (ADR 0023, chosen on the configured stack), development split: 22
        # grounds, 6 labelled, 15 unlabelled, 1 known-bad (corpus v5 at depth 13:
        # 31 / 8 / 22 / 1). The known-bad ceiling stays 1 by decision: the single
        # citation is CDC art. 42 sole paragraph beside a label on art. 42 caput
        # (a sibling paragraph) on cobranca_com_ameacas. The configured stack no
        # longer cites it; this hashed-embedder stack still does.
        #
        # Re-measured on 2026-10-04 for dataset 2.4.0 and the relationship-class
        # scope gate (ADR 0024), development split: 32 grounds, 8 labelled, 23
        # unlabelled, 1 known-bad (the same citation). consumer_notice_abstention
        # is no longer pinned at 1.0: the 4 out-of-scope development cases the
        # lexical gate cannot recognise by design leave 21 of 24 abstaining
        # (0.875) on this stack; the configured stack abstains on all 24.
        run: |
          python -m app.evaluation.consumer_runner \
            eval_data/consumer_legal_retrieval \
            --evaluate-notice \
            --split development \
            --output consumer-notice-results.json \
            --max consumer_notice_known_bad_citations=1 \
            --min consumer_notice_abstention=0.87 \
            --min consumer_notice_labelled_grounds=8
      - name: Consumer holdout report (not gated)
        # The holdout split is measured on every build and never gated, so no
        # parameter is tuned against it. Its results are uploaded below.
        run: |
          python -m app.evaluation.consumer_runner \
            eval_data/consumer_legal_retrieval \
            --split holdout \
            --output consumer-legal-retrieval-holdout.json
          python -m app.evaluation.consumer_runner \
            eval_data/consumer_legal_retrieval \
            --evaluate-notice \
            --split holdout \
            --output consumer-notice-holdout.json
      - name: Upload consumer evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-legal-retrieval-results
          path: |
            consumer-legal-retrieval-results.json
            consumer-notice-results.json
            consumer-legal-retrieval-holdout.json
            consumer-notice-holdout.json
      - name: Security gate benchmark
        # Thresholds are asserted in tests/test_security_benchmark.py; this
        # step publishes the per-category numbers in the build log.
        run: python -m app.evaluation.security_benchmark

  python-310-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,frontend]"
      - name: Python 3.10 tests
        run: pytest -q

  container-build:
    runs-on: ubuntu-latest
    needs: [test, python-310-compatibility]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target api --tag give-exit-api:ci .
      - name: Build frontend image
        run: docker build --target frontend --tag give-exit-frontend:ci .
