[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "give-exit"
version = "0.1.0"
description = "Brazilian consumer-assistance notices with auditable legal RAG"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gabriel", email = "gabrielbhl@gmail.com" }]
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "anthropic>=0.120,<1",
    "google-genai>=2.16,<3",
    "structlog>=24.1",
    "pymupdf>=1.24",
    "langdetect>=1.0.9",
    "chromadb>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.60",
    "requests>=2.31",
]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
local-embeddings = [
    "sentence-transformers>=3.0",
    "transformers>=4.51.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.10",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
# frontend/ and eval_data/ are not installable packages - only app/ is.
include = ["app*"]

[tool.setuptools.package-data]
"app.consumer" = ["data/cdc/*.html", "data/cdc/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# Matches the CI interpreter. numpy's bundled stubs (reached through chromadb)
# use 3.12-only syntax, and a stub parse error aborts the entire run, so 3.10
# is not a workable analysis target. Ruff still enforces py310 for our own
# code, which is what keeps requires-python honest.
python_version = "3.12"
strict = true

# Third-party packages that ship no type information. Ignoring their imports
# keeps strict mode meaningful for our own code instead of drowning it in
# vendor noise; every use of them stays behind an adapter in app/.
[[tool.mypy.overrides]]
module = [
    "fitz.*",
    "langdetect.*",
    "pytesseract.*",
    "reportlab.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

# We never call numpy directly; it arrives through chromadb.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
